<header class="app-header">
  <div class="header-content">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2-2 2.6-2.6z"
          />
        </svg>
      </div>

      <span>Oficina Central</span>
    </div>

    <div class="vehicle-counter">
      <span class="counter-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 16v-4.5a2 2 0 0 1 .4-1.2l1.9-2.6A2 2 0 0 1 7.9 7h8.2a2 2 0 0 1 1.6.8l1.9 2.6a2 2 0 0 1 .4 1.2V16"
          />
          <rect x="2.5" y="14" width="19" height="5.5" rx="1.6" />
          <circle cx="7" cy="19.5" r="1.6" />
          <circle cx="17" cy="19.5" r="1.6" />
        </svg>
      </span>

      <span>Veículos no Pátio: 0</span>
    </div>
  </div>
</header>

<main class="main-content">
  <section class="page-heading">
    <h1>Controle de Pátio</h1>

    <div class="page-actions">
      <div class="view-toggle">
        <button type="button" class="active">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="8" height="8" rx="1.5" />
            <rect x="13" y="3" width="8" height="8" rx="1.5" />
            <rect x="3" y="13" width="8" height="8" rx="1.5" />
            <rect x="13" y="13" width="8" height="8" rx="1.5" />
          </svg>

          Cartões
        </button>

        <button type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="1.5" />
            <path d="M3 9.5h18M3 15h18M9.5 9.5V20" />
          </svg>

          Tabela
        </button>
      </div>

      <button type="button" class="primary-button">
        <span class="plus">+</span>
        Registrar Nova Entrada
      </button>
    </div>
  </section>

  <section class="empty-state">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 21V9.8a1 1 0 0 1 .45-.84l8-5.3a1 1 0 0 1 1.1 0l8 5.3a1 1 0 0 1 .45.84V21" />
        <path d="M3 21h18" />
        <path d="M7 21v-6a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v6" />
      </svg>
    </div>

    <h2>Pátio vazio no momento</h2>

    <p>
      Nenhum veículo cadastrado ainda. Registre a primeira entrada para começar a acompanhar o
      pátio.
    </p>

    <button type="button" class="primary-button">
      <span class="plus">+</span>
      Registrar primeiro veículo
    </button>
  </section>
</main>
